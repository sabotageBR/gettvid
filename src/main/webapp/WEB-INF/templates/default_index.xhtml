	  function connect() {
		//wsocketHost = new ReconnectingWebSocket("ws://gettvid.local:8090/YoutubeServer", null, {debug: true, reconnectInterval: 3000});
		wsocketHost = new ReconnectingWebSocket("wss://gettvid.com/YoutubeServer", null, {debug: true, reconnectInterval: 600000});
		wsocketHost.onmessage = onMessage;
		wsocketHost.onopen = function(evt){
			onOpen(evt);
			flushPending();
		};
	  }
	  function safeSend(payload){
		if (!wsocketHost){
			pendingPayload = payload;
			connect();
			return;
		}
		if (wsocketHost.readyState === WebSocket.OPEN){
			wsocketHost.send(JSON.stringify(payload));
			return;
		}
		pendingPayload = payload;
		if (wsocketHost.readyState === WebSocket.CLOSED || wsocketHost.readyState === WebSocket.CLOSING){
			connect();
		}
	  }
	  function flushPending(){
		if (pendingPayload && wsocketHost && wsocketHost.readyState === WebSocket.OPEN){
			wsocketHost.send(JSON.stringify(pendingPayload));
			pendingPayload = null;
		}
	  }
	  function gvFocusDownload(btn){
		if (!btn) return;
		requestAnimationFrame(function(){
			try { btn.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) { btn.scrollIntoView(); }
			btn.classList.add('gv-attention');
			setTimeout(function(){ btn.classList.remove('gv-attention'); }, 2600);
			try { btn.focus({ preventScroll: true }); } catch (e) { btn.focus(); }
		});
	  }
