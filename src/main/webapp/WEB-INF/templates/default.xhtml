<!DOCTYPE html>
<html xmlns="https://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	lang="#{linguagem}">

<f:view contentType="text/html">
	<h:head>
		<title>#{title} | Gettvid.com</title>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="#{description}" />
		<meta name="robots" content="index, follow" />
		<meta http-equiv="X-Content-Type-Options" content="nosniff" />
		<meta name="theme-color" content="#ffffff" />
		<meta name="application-name" content="Gettvid" />

		<link rel="canonical" href="https://gettvid.com/#{urlName}" />

		<meta property="og:title" content="#{title}" />
		<meta property="og:description" content="#{summary}" />
		<meta property="og:image" content="#{thumb}" />
		<meta property="og:url" content="https://gettvid.com/#{urlName}" />
		<meta property="og:type" content="article" />
		<meta property="og:site_name" content="Gettvid" />
		<meta property="og:locale" content="#{linguagem == 'pt' ? 'pt_BR' : 'en_US'}" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="#{title}" />
		<meta name="twitter:description" content="#{summary}" />
		<meta name="twitter:image" content="#{thumb}" />

		<link rel="icon" type="image/svg+xml" href="/statics/image/icon.svg" />
		<link rel="apple-touch-icon" href="/statics/image/apple-touch-icon.png" />

		<!-- Caminho relativo: com a URL absoluta de producao, testar em
		     gettvid.local:8080 carregava o CSS de gettvid.com e nenhuma
		     alteracao local aparecia. -->
		<link rel="stylesheet" type="text/css" href="/statics/css/style-lg.css" />

		<script async="async"
			src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7271150679188760"
			crossorigin="anonymous"></script>
	</h:head>
	<h:body>
	
		<header>
		<div class="main_nav">
			<a class="logo" href="/"><span>Gettvid.com</span></a>
			<div class="language">
				
			</div>
		</div>
	</header>
	<ui:insert name="corpo" />	
	<footer>
		<div class="copyright">
			<ul class="flex flex-a-i-center">
				<li><a href="mailto:gettvid@gmail.com">gettvid@gmail.com</a></li>
			</ul>
			<p class="mag0">&#169; <span id="gettvid-year">2026</span> gettvid.com</p>
		</div>
	</footer>
		<script async="async" src="https://www.googletagmanager.com/gtag/js?id=G-YMLYQMTG49"></script>
		<script>
		  window.dataLayer = window.dataLayer || [];
		  function gtag(){dataLayer.push(arguments);}
		  gtag('js', new Date());

		  gtag('config', 'G-YMLYQMTG49');
		  (function(){
		    var y = document.getElementById('gettvid-year');
		    if (y) y.textContent = new Date().getFullYear();
		  })();
		</script>
	</h:body>
</f:view>
</html>
